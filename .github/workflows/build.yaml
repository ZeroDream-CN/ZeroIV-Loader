name: Build & deploy

# Every push compiles the loader so a broken tree is caught immediately. A tag
# additionally publishes a release: the binary, the licences the binary is
# required to ship with, a checksum file, and the complete source archive that
# corresponds to that binary.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: cmd

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match VERSION ($version). Bump VERSION or retag."
          }

      - name: Configure
        run: cmake -B BUILD .

      - name: Build Release
        run: cmake --build BUILD --config Release

      - name: Verify the ASI does not depend on the MSVC runtime
        shell: pwsh
        run: |
          # A bare .asi has to be self-contained: importing these would make it
          # fail to load wherever the VC++ redistributable is missing.
          $path = 'BUILD/BIN/Release/ZeroIV.asi'
          if (-not (Test-Path $path)) { throw "$path was not produced" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($path))
          $bad = @('MSVCP140.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCR120.dll') |
            Where-Object { $text.Contains($_) }
          if ($bad.Count -gt 0) {
            throw "ZeroIV.asi imports $($bad -join ', '): the C runtime must be linked statically (CMakeLists sets CMAKE_MSVC_RUNTIME_LIBRARY)."
          }
          Write-Host 'no MSVC runtime imports found'

      - name: Assemble release files
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $staging = 'dist'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item 'BUILD/BIN/Release/ZeroIV.asi' $staging
          Copy-Item 'LICENSE.txt' $staging
          Copy-Item 'THIRD-PARTY-NOTICES.txt' $staging

          # The corresponding source. Everything needed to rebuild is in the
          # repository (MinHook is vendored), so a plain archive of the tagged
          # tree is complete. It is committed as an asset because the archive
          # the forge generates automatically ignores submodule-era trees and
          # is not guaranteed to stay at a stable URL.
          $prefix = "ZeroIV-Loader-$version/"
          git archive --format=tar.gz --prefix=$prefix -o "$staging/ZeroIV-Loader-$version-src.tar.gz" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }

          Get-ChildItem $staging -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii "$staging/SHA256SUMS.txt"

          Get-ChildItem $staging -File | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroIV-Loader
          path: dist/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            **ZeroIV-Loader ${{ github.ref_name }}**

            Download `ZeroIV.asi` and drop it in your GTA V folder (next to
            `GTA5.exe` / `GTA5_Enhanced.exe`). Remove `OpenIV.asi` /
            `OpenRPF.asi` if present.

            ### Highlights
            - FiveM vehicle resources under `unpack-mods/` → auto `ziv_*` DLC + `dlclist`
            - `gameconfig.xml`: auto pool raises, or your file at `unpack-mods/gameconfig.xml`, or `patchGameConfig=off`
            - Pair large configs with Heap Limit Adjuster (~2048) and Packfile Limit Adjuster Enhanced

            Player guide: see `docs/fivem-mods.md` in the source archive or the repository.

            ### Assets
            - `ZeroIV-Loader-*-src.tar.gz` — corresponding source (GPL-3.0-or-later). Build with `scripts/build-cross-linux.sh` or `build.ps1`.
            - `SHA256SUMS.txt` — checksums for every file above.
            - `LICENSE.txt`, `THIRD-PARTY-NOTICES.txt` — keep next to the binary when redistributing.
          files: |
            dist/ZeroIV.asi
            dist/LICENSE.txt
            dist/THIRD-PARTY-NOTICES.txt
            dist/ZeroIV-Loader-*-src.tar.gz
            dist/SHA256SUMS.txt
